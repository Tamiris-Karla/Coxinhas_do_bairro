<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Coxinhas do Bairro - Cadastro</title>
</head>
<body data-pagina="cadastro">

<header class="cabecalho" id="cabecalho"></header>

<main class="centro">
  <form class="caixa" id="form-cadastro">
    <h2>📝 Criar conta</h2>
    <p class="sub">Só o básico, leva um minutinho.</p>

    <label for="nome">Nome completo</label>
    <input type="text" id="nome" required>

    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="seuemail@exemplo.com" required>

    <label for="telefone">Telefone / WhatsApp</label>
    <input type="tel" id="telefone" placeholder="(81) 90000-0000" required>

    <div class="linha">
      <div>
        <label for="senha">Senha</label>
        <input type="password" id="senha" minlength="6" placeholder="Mín. 6 letras" required>
      </div>
      <div>
        <label for="senha2">Repita a senha</label>
        <input type="password" id="senha2" required>
      </div>
    </div>

    <label for="rua">Rua / Avenida</label>
    <input type="text" id="rua" required>

    <div class="linha">
      <div>
        <label for="numero">Número</label>
        <input type="text" id="numero" required>
      </div>
      <div>
        <label for="bairro">Bairro</label>
        <select id="bairro" required></select>
      </div>
    </div>

    <p class="erro" id="erro"></p>
    <button class="btn grande" type="submit">Criar conta e entrar →</button>
    <p class="texto-centro">Já tem conta? <a href="login.html">Fazer login</a></p>
  </form>
</main>

<script src="script.js"></script>
</body>
</html>
